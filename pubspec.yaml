name: polkadot_marketplace
description: "A Flutter-based decentralized marketplace powered by Polkadot blockchain."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # Image handling
  image_picker: ^1.0.7
  
  # HTTP requests for IPFS
  http: ^1.2.0
  
  # Polkadot blockchain
  polkadart: ^0.4.5
  polkadart_keyring: ^0.4.4
  polkadart_scale_codec: ^1.2.1

  # API Key Hiding (Corrected packages added here)
  envied: ^1.3.2 # Use the latest available version

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # API Key Hiding (Corrected packages added here)
  build_runner: ^2.4.6
  envied_generator: ^1.3.2 # Use the corresponding generator version

flutter:
  uses-material-design: true

  # Uncomment and add assets when you have images
  # assets:
  #   - assets/images/
  #   - assets/icons/
