name: polkadot_marketplace
description: "A Flutter-based decentralized marketplace powered by Polkadot blockchain."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  image_picker: ^1.0.7
  http: ^1.2.0
  shared_preferences: ^2.5.4
  qr_flutter: ^4.1.0
  web_socket_channel: ^2.4.0  # For WebSocket connection
  convert: ^3.1.1  # For hex encoding

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/contract/metadata.json
    