name: polkadot_marketplace
description: "A Flutter-based decentralized marketplace powered by Polkadot blockchain."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6

  # Image handling
  image_picker: ^1.0.7
  
  # HTTP requests (for backend API calls)
  http: ^1.2.0
  
  # Polkadot blockchain (for future blockchain integration)
  polkadart: ^0.4.5
  polkadart_keyring: ^0.4.4
  polkadart_scale_codec: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Uncomment and add assets when you have images
  # assets:
  #   - assets/images/
  #   - assets/icons/
  