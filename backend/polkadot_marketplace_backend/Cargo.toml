[package]
name = "polkadot_marketplace_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.12"
actix-cors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.0", features = ["serde", "v4"] }
base64 = "0.22"
dotenv = "0.15"
